name: Update profile stats

on:
  schedule:
    - cron: "17 18 * * *" # daily, 01:17 Vietnam time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/stats.mjs"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node .github/scripts/stats.mjs stats.svg
      - name: Commit if changed
        run: |
          if git diff --quiet -- stats.svg && git ls-files --error-unmatch stats.svg >/dev/null 2>&1; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          git commit -m "chore: update profile stats"
          git push
